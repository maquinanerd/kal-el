# Kal El on Coolify — "Docker Compose" build pack, deployed from this repository.
#
# The same four services as docker-compose.prod.yml, adapted to a Coolify-managed server:
#
#  - No `ports:`. Coolify's proxy (Traefik) routes each generated domain to the service
#    port named in SERVICE_URL_<SERVICE>_<PORT>; nothing is published on the host.
#  - No secret is typed or copied by anyone to deploy. The POSTGRES password and
#    SESSION_SECRET are Coolify "magic" variables: Coolify generates them once, stores them in
#    the resource's environment and keeps them stable across deployments.
#  - Before the first deployment, set both domains to https in the resource's Domains
#    (the generated sslip.io names work; a real hostname needs its DNS record first).
#    COOKIE_SECURE is mandatory in production, and the CMS cannot log anyone in over http.
#
# BOOTSTRAP_TOKEN is empty by default, which disables POST /v1/bootstrap/init. On a new
# install, and only until the first owner exists:
#   1. In the resource's Environment Variables, set BOOTSTRAP_TOKEN to a random value
#      (e.g. `${SERVICE_HEX_32_BOOTSTRAP}`, which Coolify then generates) and redeploy.
#   2. Create the first site and its owner with POST {API}/v1/bootstrap/init
#      (header x-bootstrap-token), or `pnpm bootstrap` — see scripts/bootstrap.ts. This
#      creates an account: it is done by the person who will own it.
#   3. Delete BOOTSTRAP_TOKEN again and redeploy. The route refuses once a user exists, but a
#      credential that mints owners has no reason to stay in the environment.
#
# The web CMS bakes NEXT_PUBLIC_API_BASE_URL at build time: changing the API domain means
# redeploying so `cms` is rebuilt.

services:
  db:
    image: postgres:17-alpine
    environment:
      - POSTGRES_USER=kalel
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
      - POSTGRES_DB=kalel
    volumes:
      - kalel_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kalel -d kalel"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      # Declares the public URL Coolify generates for this service, routed to port 3001.
      - SERVICE_URL_API_3001
      # Cookie-secure, session-secret strength and docs exposure all key off NODE_ENV.
      - NODE_ENV=production
      # SERVICE_PASSWORD_* has no symbols, so it is safe inside the URL as it is.
      - DATABASE_URL=postgresql://kalel:${SERVICE_PASSWORD_POSTGRES}@db:5432/kalel
      - SESSION_SECRET=${SERVICE_BASE64_64_SESSION}
      # Empty unless set in Coolify for a new install (see the header): empty disables the route.
      - BOOTSTRAP_TOKEN=${BOOTSTRAP_TOKEN:-}
      - COOKIE_SECURE=true
      - RUN_MIGRATIONS=true
      - MIGRATIONS_FOLDER=/app/drizzle
      - APP_BASE_URL=${SERVICE_URL_CMS}
      - API_BASE_URL=${SERVICE_URL_API}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      # Exactly one proxy (Traefik) sits in front. Behind a CDN that also proxies, use 2.
      - TRUST_PROXY=${TRUST_PROXY:-1}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - SESSION_IDLE_TIMEOUT_MINUTES=${SESSION_IDLE_TIMEOUT_MINUTES:-720}
      - SESSION_ABSOLUTE_TIMEOUT_MINUTES=${SESSION_ABSOLUTE_TIMEOUT_MINUTES:-43200}
      - SESSION_ROTATE_MINUTES=${SESSION_ROTATE_MINUTES:-60}
      - MEDIA_STORAGE_PROVIDER=local
      - MEDIA_LOCAL_PATH=/app/uploads
      - MEDIA_MAX_BYTES=${MEDIA_MAX_BYTES:-26214400}
      - PORT=3001
      - HOST=0.0.0.0
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # /ready, not /health: it decides whether the container takes traffic.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
    volumes:
      - kalel_media:/app/uploads
    stop_grace_period: 30s
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://kalel:${SERVICE_PASSWORD_POSTGRES}@db:5432/kalel
      - POLL_INTERVAL_MS=${POLL_INTERVAL_MS:-1000}
      # The worker's level enum is narrower than the API's: no fatal, no trace.
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - OUTBOX_BATCH_SIZE=${OUTBOX_BATCH_SIZE:-20}
      - SCHEDULER_BATCH_SIZE=${SCHEDULER_BATCH_SIZE:-100}
    depends_on:
      db:
        condition: service_healthy
    # No HTTP surface and no healthcheck: liveness shows in worker_heartbeats
    # (GET /v1/sites/{id}/ops-status).
    stop_grace_period: 40s
    restart: unless-stopped

  cms:
    build:
      context: .
      dockerfile: apps/cms/Dockerfile
      args:
        # Inlined into the browser bundle: the public API origin, never an internal name.
        - NEXT_PUBLIC_API_BASE_URL=${SERVICE_URL_API}
    environment:
      - SERVICE_URL_CMS_3000
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
    depends_on:
      api:
        condition: service_healthy
    stop_grace_period: 20s
    restart: unless-stopped

volumes:
  kalel_pgdata:
  kalel_media:
