services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kalel
      POSTGRES_PASSWORD: kalel
      POSTGRES_DB: kalel
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kalel -d kalel"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - kalel_pgdata:/var/lib/postgresql/data

volumes:
  kalel_pgdata:
