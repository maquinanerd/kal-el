# Kal El production template (Contabo / Easypanel or any docker host).
# Secrets are injected via an env file — never baked into images.
# Usage: docker compose --env-file .env.prod -f docker-compose.prod.yml up -d
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kalel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env.prod}
      POSTGRES_DB: kalel
    volumes:
      - kalel_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kalel -d kalel"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:?set in .env.prod}
      SESSION_SECRET: ${SESSION_SECRET:?set in .env.prod}
      BOOTSTRAP_TOKEN: ${BOOTSTRAP_TOKEN:?set in .env.prod}
      COOKIE_SECURE: "true"
      RUN_MIGRATIONS: "true"
      MIGRATIONS_FOLDER: /app/drizzle
      APP_BASE_URL: ${APP_BASE_URL}
      API_BASE_URL: ${API_BASE_URL}
      PORT: "3001"
      HOST: "0.0.0.0"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    volumes:
      - kalel_media:/app/uploads

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:?set in .env.prod}
      POLL_INTERVAL_MS: "1000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  kalel_pgdata:
  kalel_media:
